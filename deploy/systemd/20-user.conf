[Service]
# Run the daemon as an unprivileged service account instead of root.
#
# The git deploy key is injected by systemd through LoadCredential (read as root
# before privileges are dropped), so no key material needs to live in the
# service home. `/restart` is exit(0) plus Restart=always, which needs no
# privilege either. Executing "systemctl restart belya" from inside the agent no
# longer works - that is the point of dropping privileges, not a regression.
User=belya
Group=belya
